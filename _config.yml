# Welcome to Jekyll!
#
# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"

title                    : "Emanuele Fedeli"
title_separator          : "-"
name                     : &name "Emanuele Fedeli"
description              : &description "Postdoctoral Researcher in Sociology and Quantitative Methods"

url                      : "https://emanuelefedeli.github.io"
baseurl                  : ""
repository               : "emanuelefedeli/emanuelefedeli.github.io"

# Author Profile
author:
  avatar                 : "profile.png"
  name                   : "Emanuele Fedeli"
  pronouns               :
  bio                    : "Postdoctoral Researcher in Sociology and Quantitative Methods"
  location               : "Milan, Italy"
  employer               : "University of Milan"
  uri                    :
  email                  : "nome.cognome@unimi.it"

  # Academic profiles
  academia               :
  arxiv                  :
  googlescholar          : "https://scholar.google.com/citations?user=pS_XDH4AAAAJ&hl=it"
  inspire-hep            :
  impactstory            :
  orcid                  :
  semantic               :
  ssrn                   :
  pubmed                 :
  researchgate           :
  scopus                 :
  zotero                 :

  # Coding / repositories
  bitbucket              :
  codepen                :
  dribbble               :
  github                 :
  kaggle                 :
  stackoverflow          :

  # Social media
  artstation             :
  bluesky                :
  facebook               :
  flickr                 :
  foursquare             :
  goodreads              :
  google_plus            :
  keybase                :
  instagram              :
  lastfm                 :
  linkedin               :
  mastodon               :
  medium                 :
  pinterest              :
  soundcloud             :
  steam                  :
  telegram               :
  tumblr                 :
  twitter                :
  vine                   :
  weibo                  :
  wikipedia              :
  xing                   :
  youtube                :
  zhihu                  :

# Publication categories
publication_category:
  books:
    title                : "Books"

  manuscripts:
    title                : "Journal Articles"

  conferences:
    title                : "Conference Papers"

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Comments
comments:
  provider               :

  disqus:
    shortname            :

  discourse:
    server               :

  facebook:
    appid                :
    num_posts            :
    colorscheme          :

# Staticman
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']

  transforms:
    email                : "md5"

  generatedFields:
    date:
      type               : "date"

      options:
        format           : "iso8601"

# Atom feed
atom_feed:
  hide                   : false
  path                   :

# SEO
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 :
og_description           :

social:
  type                   :
  name                   :
  links                  :

# Analytics
analytics:
  provider               : false

  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown                 : kramdown
highlighter              : rouge
lsi                      : false
excerpt_separator        : "\n\n"
incremental              : false

# Markdown Processing
kramdown:
  input                  : GFM
  hard_wrap              : false
  auto_ids               : true
  footnote_nr            : 1
  entity_output          : as_char
  toc_levels             : 1..6
  smart_quotes           : lsquo,rsquo,ldquo,rdquo
  enable_coderay         : false

# Collections
collections: {}

# Defaults
defaults:

  # Posts
  - scope:
      path               : ""
      type               : posts

    values:
      layout             : single
      author_profile     : true
      read_time          : true
      comments           : true
      share              : true
      related            : true

  # Pages
  - scope:
      path               : ""
      type               : pages

    values:
      layout             : single
      author_profile     : true

# Sass / SCSS
sass:
  sass_dir               : _sass
  style                  : compressed

# Output
permalink                : /:categories/:title/
timezone                 : Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# GitHub Pages whitelist
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type                   : liquid
  path                   : /categories/

tag_archive:
  type                   : liquid
  path                   : /tags/

# HTML Compression
compress_html:
  clippings              : all

  ignore:
    envs                 : development
